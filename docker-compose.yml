services:
  # Base de datos MySQL para ms-auth (opcional si usas H2)
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-authdb}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
    networks:
      - pasteleria-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservicio de Autenticación
  ms-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-auth
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8086}:${SERVER_PORT:-8086}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8086}
      # Conexión a la base de datos
      DB_URL: ${DB_URL}
      DB_DRIVER: ${DB_DRIVER}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Clave secreta compartida para validar tokens en toda la arquitectura
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
    depends_on:
      mysql-auth:
        condition: service_healthy
    networks:
      - pasteleria-network

# Red compartida tipo 'bridge' externa creada previamente para los microservicios
networks:
  pasteleria-network:
    external: true

volumes:
  mysql_auth_data:
